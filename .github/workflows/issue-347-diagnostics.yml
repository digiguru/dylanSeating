name: Issue 347 lockfile fix

on:
  push:
    branches:
      - chore/issue-347-security-maintenance

permissions:
  contents: write

env:
  PUPPETEER_SKIP_DOWNLOAD: "true"

jobs:
  fix-lockfile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: chore/issue-347-security-maintenance
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply non-breaking npm audit fix to lockfile
        run: npm audit fix --package-lock-only
      - name: Verify audit
        run: npm audit --audit-level=high
      - name: Commit lockfile when changed
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "No lockfile changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "fix: resolve js-yaml audit finding"
          git push
