name: Upgrade dependencies

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  upgrade:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: chore/dependabot-ci

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.17.0
          cache: npm

      - name: Upgrade all compatible direct dependencies
        run: |
          npx --yes npm-check-updates@latest -u --reject @babel/core,@babel/preset-env
          npm install --save-dev @babel/core@^7 @babel/preset-env@^7

      - name: Regenerate lockfile
        run: npm install

      - name: Run CI tests
        run: npm run test:ci

      - name: Remove one-shot workflow
        run: rm .github/workflows/upgrade-dependencies.yml

      - name: Commit upgraded dependencies
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json .github/workflows/upgrade-dependencies.yml
          git commit -m "Upgrade npm dependencies"
          git push
