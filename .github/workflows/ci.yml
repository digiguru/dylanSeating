name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

env:
  PUPPETEER_CACHE_DIR: ${{ github.workspace }}/.cache/puppeteer

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: PUPPETEER_SKIP_DOWNLOAD=true npm ci

      - name: Install browser system dependencies
        run: sudo env PUPPETEER_CACHE_DIR="$PUPPETEER_CACHE_DIR" npx puppeteer browsers install chrome --install-deps

      - name: Build browser assets
        run: npm run build

      - name: Validate runtime modules
        run: npm run check

      - name: Run tests
        run: npm run test:ci
